name: Essential launch checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: essential-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  essential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: https://www.felexia.pro
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint -- src
      - name: Check authorized recette harness syntax
        run: |
          node --check scripts/essential-action-runner.cjs
          node --check scripts/verify-essential-company.cjs
          node --check scripts/verify-essential-corrections.cjs
          node --check scripts/verify-essential-recovery.cjs
          node --check scripts/verify-essential-expiry.cjs
      - run: npm run test:regressions
      - run: npm run test:light-launch
      - name: Verify marketing scroll zoom compatibility
        run: node training/marketing/20261101-zoom-compatibility/verify-controller.cjs
      - run: npm run test:e-invoicing
      - run: npx tsx training/e-invoicing/20261031/verify-pdf.ts
      - run: npx tsx scripts/verify-operator-access.ts
      - run: npx tsx scripts/verify-invitation-roles.ts
      - run: npx tsx scripts/verify-invitation-callback.ts
      - run: node scripts/verify-operator-read-bootstrap.mjs --report
      - run: npx tsx scripts/verify-numbering-model.ts
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/felexia-qa" --no-save --ignore-scripts @electric-sql/pglite@0.5.14
      - name: Verify database boundaries and transactions
        run: |
          node training/pro-full-audit/20261101/verify-advanced-database.mjs --pglite-root="$RUNNER_TEMP/felexia-qa"
          node training/pro-full-audit/20261101/verify-advanced-database.mjs --pglite-root="$RUNNER_TEMP/felexia-qa" --relaxed-v3
          node training/pro-offers/20261101/verify-pro-database.mjs --pglite-root="$RUNNER_TEMP/felexia-qa"
          node training/pro-offers/20261101/verify-pro-database.mjs --pglite-root="$RUNNER_TEMP/felexia-qa" --relaxed-v3
          node training/essential-fixes/20261031/verify-finance.mjs --pglite-root="$RUNNER_TEMP/felexia-qa"
          node training/essential-fixes/20261031/verify-finance.mjs --pglite-root="$RUNNER_TEMP/felexia-qa" --relaxed-v3
          node training/essential-fixes/20261031/verify-subscription-access.mjs --pglite-root="$RUNNER_TEMP/felexia-qa"
          node training/essential-fixes/20261031/verify-subscription-access.mjs --pglite-root="$RUNNER_TEMP/felexia-qa" --relaxed-v3
          node training/essential-fixes/20261031/verify-credit-notes.mjs --pglite-root="$RUNNER_TEMP/felexia-qa"
          node training/essential-fixes/20261031/verify-credit-notes.mjs --pglite-root="$RUNNER_TEMP/felexia-qa" --relaxed-v3
          node training/essential-fixes/20261031/verify-supplier-credit-notes-isolated.mjs --pglite-root="$RUNNER_TEMP/felexia-qa"
          node training/essential-fixes/20261031/verify-supplier-credit-notes-isolated.mjs --pglite-root="$RUNNER_TEMP/felexia-qa" --relaxed-v3
      - name: Verify PRO commercial and preparatory payroll transactions
        run: |
          node training/launch-fixes/20261101/pro-transactions/verify-database.mjs --pglite-root="$RUNNER_TEMP/felexia-qa"
          node training/launch-fixes/20261101/pro-transactions/verify-database.mjs --pglite-root="$RUNNER_TEMP/felexia-qa" --relaxed-v3
          node training/launch-fixes/20261101/pro-transactions/verify-ui.cjs
          node training/launch-fixes/20261101/pro-transactions/verify-hr-navigation.cjs
          node training/launch-fixes/20261101/pro-transactions/verify-conflict-status.mjs --pglite-root="$RUNNER_TEMP/felexia-qa"
          node training/launch-fixes/20261101/pro-transactions/verify-conflict-status.mjs --pglite-root="$RUNNER_TEMP/felexia-qa" --relaxed-v3
      - name: Verify electronic invoicing decimal and database boundaries
        run: |
          npx tsx training/e-invoicing/20261031/verify-decimal-parity.ts --pglite-root="$RUNNER_TEMP/felexia-qa"
          node training/e-invoicing/20261031/verify-database.mjs --pglite-root="$RUNNER_TEMP/felexia-qa"
          node training/e-invoicing/20261031/verify-database.mjs --pglite-root="$RUNNER_TEMP/felexia-qa" --relaxed-v3
          node training/e-invoicing/20261031/verify-operations-database.mjs --pglite-root="$RUNNER_TEMP/felexia-qa"
          node training/e-invoicing/20261031/verify-operations-database.mjs --pglite-root="$RUNNER_TEMP/felexia-qa" --relaxed-v3
          node training/e-invoicing/20261031/verify-operations-installer.mjs --pglite-root="$RUNNER_TEMP/felexia-qa"
      - name: Verify launch financial, forecast and support corrections
        run: |
          node training/launch-fixes/20261101/essential/verify-financial-indicators.cjs
          node training/launch-fixes/20261101/essential/verify-treasury-default.mjs --pglite-root="$RUNNER_TEMP/felexia-qa"
          node training/launch-fixes/20261101/essential/verify-treasury-default.mjs --pglite-root="$RUNNER_TEMP/felexia-qa" --relaxed-v3
          node training/launch-fixes/20261101/essential/verify-integrated-105-107.mjs --pglite-root="$RUNNER_TEMP/felexia-qa" --installer
          node training/launch-fixes/20261101/essential/verify-integrated-105-107.mjs --pglite-root="$RUNNER_TEMP/felexia-qa" --installer --relaxed-v3
          node training/launch-fixes/20261101/forecast-security/verify-forecast-security.cjs
          node training/launch-fixes/20261101/forecast-security/verify-billing-security.cjs
          node training/launch-fixes/20261101/forecast-security/verify-public-config.cjs
          npx tsx training/launch-fixes/20261101/support/verify-regressions.ts
          node training/launch-fixes/20261101/verify-contract.cjs
          node training/launch-fixes/20261101/verify-public-home.cjs
          node training/launch-fixes/20261101/pro-transactions/verify-chart-export.cjs
      - name: Verify checkout, recovery, exports and histories
        run: |
          node training/price-chat/20261101/verify-repricing.cjs
          node training/price-chat/20261101/verify-legacy-webhook.cjs
          npx tsx training/support-assistant/20261101/verify-knowledge.ts
          npx tsx training/support-assistant/20261101/verify-policy.ts
          npx tsx training/support-assistant/20261101/verify-fallback.ts
          node training/support-assistant/20261101/verify-assistant.cjs
          node training/support-assistant/20261101/verify-widget.cjs
          node training/essential-fixes/20261031/verify-checkout-fixtures.cjs
          node training/pro-offer/20261101/verify-billing.cjs
          node training/pro-offer/20261101/verify-provisioning.cjs
          node training/pro-offer/20261101/verify-quote-portal.cjs
          node training/pro-quote/20261101/verify-commercial-ui.cjs
          node training/pro-full-audit/20261101/verify-payroll.cjs
          node training/pro-full-audit/20261101/verify-domain.cjs
          node training/pro-offers/20261101/verify-access.cjs
          node training/pro-offers/20261101/verify-readonly-ui.cjs
          node training/pro-offers/20261101/verify-signup-continuation.cjs
          node training/pro-offers/20261101/verify-hr-guards.cjs
          node training/essential-fixes/20261031/verify-webhook-recovery.cjs
          node training/essential-fixes/20261031/verify-recovery-actions.cjs
          node training/essential-fixes/20261031/verify-expiry-harness.cjs
          node training/essential-fixes/20261031/verify-middleware-access.cjs
          node training/essential-fixes/20261031/verify-logout-route.cjs
          node training/essential-fixes/20261031/verify-trial-notifications.cjs
          node scripts/verify-essential-workflows.mjs
          node training/essential-fixes/20261031/verify-supplier-credit-print.cjs
          npx tsx scripts/verify-print-outputs.tsx
      - run: npm run build
      - run: node training/e-invoicing/20261031/verify-tracing.mjs
